use_default_settings:
  engines:
    # Load only these default engines; everything else (DuckDuckGo, Brave,
    # Startpage, the Tor engines ahmia/torch, wikidata, ...) is not loaded.
    keep_only:
      - google cse
      - bing
      - wikipedia

general:
  instance_name: "Scrape Search"
  debug: false
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "change-this-secret-key-in-production"
  limiter: false
  image_proxy: false
  method: "GET"

ui:
  static_use_hash: true
  default_theme: simple
  results_on_new_tab: false
  theme_args:
    simple_style: dark

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20

engines:
  # DuckDuckGo, Brave, Qwant and Startpage answer SearXNG's HTTP client only
  # with CAPTCHA / 429, even at a handful of requests per day. The API queries
  # them itself (headless Firefox / ddgs), so SearXNG keeps only engines that
  # still work from here (see use_default_settings.engines.keep_only above).
  - name: google cse
    engine: google_cse
    shortcut: goc
    disabled: false

  - name: bing
    engine: bing
    shortcut: bi
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
